name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: Project/backend

      - name: Run tests
        run: npm test
        working-directory: Project/backend

      - name: Build Docker image
        run: docker build -t backend-app .
        working-directory: Project/backend