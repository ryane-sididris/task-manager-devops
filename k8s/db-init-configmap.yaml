apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        matiere TEXT,
        title TEXT NOT NULL,
        description TEXT,
        priority TEXT DEFAULT 'Basse',
        status TEXT DEFAULT 'À faire'
    );

    INSERT INTO tasks (matiere, title, description, priority, status) VALUES
