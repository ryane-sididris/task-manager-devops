        ('DevOps', 'Pipeline CI/CD', 'Configurer GitHub Actions pour build et deploy', 'Haute', 'À faire'),
        ('Général', 'Rédiger le README', 'Documenter l architecture et les étapes de déploiement', 'Moyenne', 'À faire');